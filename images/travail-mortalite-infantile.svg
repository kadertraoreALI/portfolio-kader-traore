<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Illustration du travail sur les déterminants de la mortalité infantile en Côte d'Ivoire">
  <rect width="600" height="340" fill="#0B3D62"/>
  <text x="30" y="42" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Mortalité infantile — Côte d'Ivoire / Sénégal</text>
  <text x="30" y="66" font-family="Arial, sans-serif" font-size="12" fill="#8FCBD3">UE13 — État de santé et organisation — UCA</text>

  <g font-family="Arial, sans-serif" font-size="11" fill="#BFE9EE">
    <rect x="30" y="90" width="230" height="26" fill="#145374"/>
    <rect x="30" y="90" width="230" height="26" fill="none" stroke="#1E9AAE" stroke-width="1"/>
    <text x="40" y="107">Côte d'Ivoire</text>
    <rect x="270" y="90" width="124" height="26" fill="#5FD0D9"/>
    <text x="330" y="108" fill="#0B3D62" font-weight="700" text-anchor="middle">52 ‰</text>

    <rect x="30" y="128" width="230" height="26" fill="#145374"/>
    <rect x="30" y="128" width="230" height="26" fill="none" stroke="#1E9AAE" stroke-width="1"/>
    <text x="40" y="145">Sénégal</text>
    <rect x="270" y="128" width="67" height="26" fill="#5FD0D9"/>
    <text x="300" y="146" fill="#0B3D62" font-weight="700" text-anchor="middle">28 ‰</text>
  </g>

  <polyline points="30,270 90,240 150,225 210,200 270,185 330,165 390,150 450,140 510,132 570,128" fill="none" stroke="#5FD0D9" stroke-width="3"/>
  <text x="30" y="300" font-family="Arial, sans-serif" font-size="12" fill="#8FCBD3">Évolution du taux de mortalité infantile, 1960–2022 (illustration)</text>
</svg>
